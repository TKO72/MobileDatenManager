      - name: Configure version and fixed signing
        run: |
          cat > source/MobileDatenManager/app/build.gradle <<'GRADLEEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'de.mobilepreferred.manager'
              compileSdk 36

              signingConfigs {
                  fixed {
                      storeFile file('mdm-fixed.jks')
                      storePassword 'MDM-2026-fixed!'
                      keyAlias 'mdm'
                      keyPassword 'MDM-2026-fixed!'
                  }
              }

              defaultConfig {
                  applicationId 'de.mobilepreferred.manager'
                  minSdk 26
                  targetSdk 36
                  versionCode 42
                  versionName '4.2'
              }

              buildFeatures {
                  aidl true
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fixed
                  }
              }
          }

          dependencies {
              def shizuku_version = '13.1.5'
              implementation "dev.rikka.shizuku:api:$shizuku_version"
              implementation "dev.rikka.shizuku:provider:$shizuku_version"
          }
          GRADLEEOF

      - name: Build APK
        working-directory: source/MobileDatenManager
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK signature
        run: apksigner verify --print-certs source/MobileDatenManager/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileDatenManager-V4.2-APK
          path: source/MobileDatenManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
