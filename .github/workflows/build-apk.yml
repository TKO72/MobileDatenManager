name: Build MobileDatenManager V4.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MobileDatenManager_V4_SamsungFirewall_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Unpack original V4 source
        run: |
          rm -rf source
          mkdir source
          unzip -oq MobileDatenManager_V4_SamsungFirewall_Source.zip -d source
          test -f source/MobileDatenManager/app/src/main/java/de/mobilepreferred/manager/MainActivity.java

