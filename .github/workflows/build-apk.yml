name: Build MobileDatenManager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MobileDatenManager_V1_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Unpack source
        run: unzip -q MobileDatenManager_V1_Source.zip -d source

      - name: Build APK
        working-directory: source/MobileDatenManager
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileDatenManager-APK
          path: source/MobileDatenManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
