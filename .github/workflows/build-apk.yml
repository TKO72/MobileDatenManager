name: Build MobileDatenManager APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Unpack source
        run: |
          rm -rf source
          mkdir source
          unzip -q MobileDatenManager_V1_Source.zip -d source

      - name: Replace Manifest
        run: |
          cat > source/MobileDatenManager/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />

              <application
                  android:allowBackup="false"
                  android:label="Mobile Daten Manager"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "===== MANIFEST ====="
          cat source/MobileDatenManager/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: source/MobileDatenManager
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileDatenManager-APK
          path: source/MobileDatenManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Unpack source
        run: unzip -q MobileDatenManager_V1_Source.zip -d source

      - name: Build APK
        working-directory: source/MobileDatenManager
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileDatenManager-APK
          path: source/MobileDatenManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
